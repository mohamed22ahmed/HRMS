name: HRMS CI

on:
  push:
    branches:
      - development
      - staging
      - main
  pull_request:
    branches:
      - development
      - staging
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/employee-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Grant Maven wrapper permission
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw -B verify

  frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/hrms-angular

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/hrms-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build
