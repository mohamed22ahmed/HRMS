
name: HRMS CI

on:
  push:
    branches:
      - development
      - staging
      - main
  pull_request:
    branches:
      - development
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend/hrms-angular

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/hrms-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hrms
          POSTGRES_USER: mohamed
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mohamed -d hrms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/employee-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Grant Maven wrapper permission
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hrms
          SPRING_DATASOURCE_USERNAME: mohamed
          SPRING_DATASOURCE_PASSWORD: password
