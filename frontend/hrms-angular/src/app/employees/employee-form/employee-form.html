<div class="backdrop" (click)="cancelled.emit()">
  <section class="form-dialog" role="dialog" aria-modal="true" [attr.aria-label]="employee ? 'Edit employee' : 'Add employee'" (click)="$event.stopPropagation()">
    <header class="dialog-header">
      <div>
        <span class="eyebrow">EMPLOYEE DIRECTORY</span>
        <h2>{{ employee ? 'Edit employee' : 'Add employee' }}</h2>
        <p>Enter the employee details below.</p>
      </div>
      <button class="close-button" type="button" aria-label="Close" (click)="cancelled.emit()">×</button>
    </header>

    <form #employeeForm="ngForm" (ngSubmit)="submit()">
      <div class="form-grid">
        <label>Employee number<input name="employeeNumber" [(ngModel)]="form.employeeNumber" required maxlength="30" /></label>
        <label>Hire date<input name="hireDate" type="date" [(ngModel)]="form.hireDate" required /></label>
        <label>First name<input name="firstName" [(ngModel)]="form.firstName" required maxlength="100" /></label>
        <label>Last name<input name="lastName" [(ngModel)]="form.lastName" required maxlength="100" /></label>
        <label>Email address<input name="email" type="email" [(ngModel)]="form.email" required /></label>
        <label>Phone<input name="phone" type="tel" [(ngModel)]="form.phone" /></label>
        <label>Job title<input name="jobTitle" [(ngModel)]="form.jobTitle" /></label>
        <label>Department ID<input name="departmentId" [(ngModel)]="form.departmentId" placeholder="Optional UUID" /></label>
        @if (employee) {
          <label>Employment status
            <select name="employmentStatus" [(ngModel)]="form.employmentStatus">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
              <option value="ON_LEAVE">On leave</option>
              <option value="TERMINATED">Terminated</option>
            </select>
          </label>
        }
      </div>

      @if (error) { <p class="form-error" role="alert">{{ error }}</p> }

      <footer class="dialog-actions">
        <button class="cancel-button" type="button" [disabled]="saving" (click)="cancelled.emit()">Cancel</button>
        <button class="save-button" type="submit" [disabled]="employeeForm.invalid || saving">
          {{ saving ? 'Saving…' : employee ? 'Save changes' : 'Add employee' }}
        </button>
      </footer>
    </form>
  </section>
</div>
