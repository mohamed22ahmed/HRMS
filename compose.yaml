
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hrms-network

  employee-service:
    build:
      context: ./services/employee-service
      dockerfile: Dockerfile
    image: hrms/employee-service:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${EMPLOYEE_SERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network

  angular:
    build:
      context: ./frontend/hrms-angular
      dockerfile: Dockerfile
    image: hrms/angular:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANGULAR_PORT}:80"
    depends_on:
      - employee-service
    networks:
      - hrms-network

volumes:
  postgres_data:

networks:
  hrms-network:
    driver: bridge
